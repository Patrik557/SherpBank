<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sherp Bank — Přihlášení</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#003f8a;--yellow:#ffcc00;--bg:#51545b;--muted:#6b7280;--dark:#0f172a}
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, 'Helvetica Neue', Arial;
      /* OPRAVA: Změněno na .webp a přidáno jemné zatmavení pro lepší čitelnost */
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('fotky/večer.jpg') no-repeat center center fixed;
      background-size: cover;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dark);
    }

    .login-container {
      width: 100%;
      max-width: 600px;
      padding: 30px;
    }
    
    .login-card {background: rgba(87, 86, 86, 0.6);     
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      padding: 50px 40px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.4);
      
    }

    .logo-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0px;
      margin-bottom: 0px;
    }

    .logo-header img { height: 200px; width:300px; }
    .logo-header h1 { font-size: 5px; color: var(--blue); font-weight: 650; margin: 0; }
    
    p.subtitle { color: var(--muted); margin-bottom: 35px; font-size: 15px; font-weight: 500; }

    .form-group { margin-bottom: 25px; text-align: left; }
    label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 13px; text-transform: uppercase; color: var(--blue); letter-spacing: 0.5px; }
    
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      font-size: 16px;
      background: rgb(156, 150, 150);
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(0,63,138,0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,63,138,0.3);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      background: #d2d3d4;
    }

    .error {
      color: #dc2626;
      background: #fee2e2;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-header">
        <img src="fotky/Sherp%20logo%20bank.png" alt="Sherp Bank">
        
      </div>
      
      <p class="subtitle">Bezpečné přihlášení do bankovnictví</p>

      <form id="loginForm">
        <div class="error" id="errorMsg"></div>
        
        <div class="form-group">
          <label for="username">Uživatelské jméno</label>
          <input type="text" id="username" required placeholder="Zadejte jméno">
        </div>

        <div class="form-group">
          <label for="password">Heslo</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="submit-btn">Vstoupit do banky</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const err = document.getElementById('errorMsg');

      if (u === 'admin' && p === 'borec') {
        sessionStorage.setItem('sherp_login_token', 'authenticated');
        window.location.href = 'domovska-stranka.html';
      } else {
        err.textContent = 'Nesprávné údaje. Zkuste to znovu.';
        err.style.display = 'block';
      }
    });
  </script>

</body>

</html>
